  drop, and the ZipFoam midsole, designed to promote natural movement and foot health.
  Surfaced as a portfolio company of Norwest Venture Partners and added to the API
  Evangelist network. Topo Athletic operates a direct-to-consumer e-commerce site at
  topoathletic.com; as of this enrichment pass it publishes no public developer API,
  developer portal, or API documentation. It does publish a machine-readable /llms.txt
  describing its catalog and support surface.'
